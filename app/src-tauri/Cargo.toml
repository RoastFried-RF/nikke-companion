[package]
name = "nikke-companion"
version = "0.1.0"
description = "니케 컴패니언 오버레이"
edition = "2021"
publish = false

# 라이브러리와 실행 파일의 이름이 같으면 Windows에서 .pdb가 겹친다.
[lib]
name = "nikke_companion_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order: 엔진 데이터의 키 순서(니케·보스 프리셋)를 파일 그대로 화면에 넘긴다 — Node 런타임과 같은 순서.
serde_json = { version = "1", features = ["preserve_order"] }

[target."cfg(windows)".dependencies]
rfd = { version = "0.18.0", default-features = false }
